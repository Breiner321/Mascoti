name: mascoti
description: "Mascoti: app veterinaria (Flutter + Firebase, arquitectura microkernel)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

# Los paquetes se agregan con `flutter pub add` (ver scripts/setup.ps1 y docs/stack.md)
# para que pub resuelva automáticamente versiones compatibles entre sí.
dependencies:
  cloud_firestore: ^6.10.0
  file_picker: ^13.1.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.1
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  geoflutterfire_plus: ^0.0.34
  geolocator: ^14.0.1
  go_router: ^18.0.2
  google_sign_in: ^7.1.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.0
  table_calendar: ^3.3.0
  url_launcher: ^6.3.3

dev_dependencies:
  fake_async: ^1.3.3
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
